name: Build DreamGPU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build meson pkg-config cmake \
            python3-venv python3-tomli libglib2.0-dev libpixman-1-dev libsdl2-dev \
            libepoxy-dev libdrm-dev libgbm-dev libslirp-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev mingw-w64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build DreamGPU
        env:
          DREAMGPU_BUILD: all
        run: cargo build --release

      - name: Package files for download
        run: |
          mkdir -p dist
          cp -r target/qemu-build dist/
          cp target/guest/dreamgpu.exe dist/

      - name: Upload zip file
        uses: actions/upload-artifact@v4
        with:
          name: dreamgpu-build
          path: dist/
