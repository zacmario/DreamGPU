name: Build DreamGPU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build meson pkg-config cmake \
            python3-venv python3-tomli libglib2.0-dev libpixman-1-dev libsdl2-dev \
            libepoxy-dev libdrm-dev libgbm-dev libslirp-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev mingw-w64 \
            libusb-1.0-0-dev libvirglrenderer-dev libgtk-3-dev \
            libpipewire-0.3-dev libasound2-dev libcap-ng-dev libattr1-dev \
            libudev-dev libclang-dev clang flex bison

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build DreamGPU
        env:
          DREAMGPU_BUILD: all
        run: cargo build --release

      - name: Show Meson error log if build fails
        if: failure()
        run: |
          tail -n 60 target/qemu-build/meson-logs/meson-log.txt || true
          cat docs/* 2>/dev/null || true

      - name: Package files for download
        run: |
          mkdir -p dist
          cp -r target/qemu-build dist/
          cp target/guest/dreamgpu.exe dist/

      - name: Upload zip file
        uses: actions/upload-artifact@v4
        with:
          name: dreamgpu-build
          path: dist/
          
